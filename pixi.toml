[workspace]
name = "ludens-shell"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo-compiler = ">=1.2.0,<2"

# wasm64 build and the parity gate: dev-only, see wasm.toml.
[feature.wasm.dependencies]
python = ">=3.11"
clang = "23.1.4.*"
lld = "23.1.4.*"
llvm-tools = "23.1.4.*"
nodejs = "24.*"

[feature.wasm.pypi-dependencies]
ludens-wasm-rt = { git = "https://github.com/Hundo1018/ludens-wasm-rt", rev = "43ed5ec2cb2d23036d8b5ca4af171fbcaa302758" }

[feature.wasm.tasks]
parity = "python3 scripts/parity.py"

[environments]
wasm = { features = ["wasm"] }
