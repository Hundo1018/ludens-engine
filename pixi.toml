[workspace]
name = "ludens-engine"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Same exact pins as ludens-core: the engine imports `max` (parallelize), which the
# standalone compiler package does not carry.
modular = "==26.7.0"
mojo = "==1.2.0"

# wasm64 build and the parity gate: dev-only, see wasm.toml.
[feature.wasm.dependencies]
python = ">=3.11"
clang = "23.1.4.*"
lld = "23.1.4.*"
llvm-tools = "23.1.4.*"
nodejs = "24.*"

[feature.wasm.pypi-dependencies]
ludens-wasm-rt = { git = "https://github.com/Hundo1018/ludens-wasm-rt", rev = "0845b4280f3dbd6ab7666cd312f236e747cfd31c" }

[feature.wasm.tasks]
parity = "python3 scripts/parity.py"
build-wasm = "bash scripts/build_wasm.sh"
build-web = { cmd = "python3 scripts/build_web.py", depends-on = ["build-wasm"] }
test-web = { cmd = "bash scripts/test_web.sh", depends-on = ["build-web"] }
bench = "python3 scripts/bench.py"
multi-wasm-probe = "python3 scripts/multi_wasm_probe.py"
parity-gate = "python3 scripts/parity_gate.py"
serve-web = { cmd = "python3 shell/web/serve.py 8000 build/web", depends-on = ["build-web"] }
# B1 acceptance: app_init + 1 frame under node must not trap.
smoke-node = { cmd = "python3 scripts/smoke_node.py", depends-on = ["build-wasm"] }
# #6 (E1): the directory rules (selftest: `pixi run -e wasm check-layout --selftest`) and the command-layer test.
check-layout = "python3 scripts/check_layout.py"
test-editor = "python3 scripts/test_editor.py"
# #11 (E6): the native editor core, the `ludens` command line, and its test.
build-core = "python3 scripts/build_core.py"
# #17 (E12): the ui/ toolkit tests, built with the standard library only.
test-ui = "python3 scripts/test_native.py"
test-game = "python3 scripts/test_native.py arena arena_controls arena_camera arena_sfx arena_hud arena_input game_mode mesh_pass"
test-skinning = "python3 scripts/test_native.py skinning_parity"
test-arena-probe = "python3 scripts/test_native.py arena_probe_native"
ui-parity = "python3 scripts/ui_parity.py"
xfer-parity = "python3 scripts/xfer_parity.py"
sheet-parity = "python3 scripts/sheet_parity.py"
game-parity = "python3 scripts/game_parity.py"
game-shot = "python3 scripts/game_shot.py"
build-pages = "python3 scripts/build_pages.py"
sheet-cost = "python3 scripts/sheet_cost.py"
test-pad = "node --experimental-strip-types --no-warnings scripts/test_pad.mjs"
test-vpad = "node --experimental-strip-types --no-warnings scripts/test_vpad.mjs"
test-assets = "node --no-warnings scripts/test_assets.mjs"
ludens = "python3 scripts/ludens.py"
test-cli = "python3 tests/test_cli.py"
test-os = "python3 scripts/test_os.py"
test-build = "python3 tests/test_build.py"

[environments]
wasm = { features = ["wasm"] }
