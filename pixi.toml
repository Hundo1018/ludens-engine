[workspace]
authors = ["Tien Chueh Wang <f74169@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "ludens-engine"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"
license = "MIT OR Apache-2.0"
license-file = "LICENSE-MIT"
preview = ["pixi-build"]

[tasks]
# Precompile all ludens-engine packages into build/ (required before run/test).
build = "bash scripts/build_engine.sh"
# Architecture index + gate (tools/archindex.mojo): `pixi run arch -- <cmd>`.
# The wrapper rebuilds build/archindex only when the source changed.
arch = "bash scripts/arch.sh"
# Machine gate for docs/ARCHITECTURE.md S1 (layers/cycles/reach-through)
# plus S3 (every tests/test_*.mojo declares a valid, mechanically-checked
# tier header): fails the build the same way a compile error would.
arch-check = { cmd = "bash scripts/arch.sh check && bash scripts/arch.sh tiers --check", depends-on = ["build"] }
# Per-tier test runs (docs/design/17.0b-test-tiers.md): each is just the
# full runner filtered to one declared tier.
test-unit = { cmd = "bash scripts/run_tests.sh unit", depends-on = ["build", "arch-check"] }
test-component = { cmd = "bash scripts/run_tests.sh component", depends-on = ["build", "arch-check"] }
test-integration = { cmd = "bash scripts/run_tests.sh integration", depends-on = ["build", "arch-check"] }
test-system = { cmd = "bash scripts/run_tests.sh system", depends-on = ["build", "arch-check"] }
test-stress = { cmd = "bash scripts/run_tests.sh stress", depends-on = ["build", "arch-check"] }
# Build, then run the fast gate: unit -> component -> integration -> system
# (fastest feedback first; stress is slower/extreme and excluded here).
test = { cmd = "bash scripts/run_tests.sh unit component integration system", depends-on = ["build", "arch-check"] }
# Build, then run every tier, including stress.
test-all = { cmd = "bash scripts/run_tests.sh unit component integration system stress", depends-on = ["build", "arch-check"] }
# Build the C-ABI shared library build/libludens.so (embed/capi.mojo, header embed/ludens.h; ROADMAP 12.1).
capi = { cmd = "mojo build --emit shared-lib -I build -o build/libludens.so embed/capi.mojo", depends-on = ["build"] }
bindings = "python3 scripts/gen_bindings.py"
# Precompile every package with an f64 world scalar into build64/ (ROADMAP 17.8; scripts/build_f64.sh).
build-f64 = "bash scripts/build_f64.sh"
# Compile every GPU test and bench for an explicit accelerator (default sm_86) without running it (ROADMAP 17.17).
gpu-compile = { cmd = "bash scripts/gpu_compile_check.sh", depends-on = ["build"] }
# Build the Python wheel build/dist/ludens-*.whl (python/build_wheel.py; ROADMAP 17.21).
wheel = { cmd = "python3 python/build_wheel.py", depends-on = ["build"] }
# Dead file references in README / CLAUDE / ROADMAP / ARCHITECTURE (scripts/doclint.py; ROADMAP 17.82).
doclint = "python3 scripts/doclint.py"
# Floating-point flag policy: exact toolchain pins, pinned target, no fast-math / -O (scripts/flag_policy.py; ROADMAP 17.84).
flag-policy = "python3 scripts/flag_policy.py"
# Engine modules nothing in the engine or examples imports, gated by scripts/orphans_allow.txt (ROADMAP 17.82).
orphans = "python3 scripts/orphans.py"
# Seed sweeps over randomised tests via LUDENS_SEED (scripts/fuzz.py; ROADMAP 17.82).
fuzz = { cmd = "python3 scripts/fuzz.py", depends-on = ["build"] }
# Each test twice: run-to-run differences + per-file run time (scripts/stability.py; ROADMAP 17.82).
stability = { cmd = "python3 scripts/stability.py", depends-on = ["build"] }
# Bench samples with host fingerprint, noise-aware compare, slopes, report governance (scripts/perf.py; ROADMAP 17.83).
perf = "python3 scripts/perf.py"
# Symbol-level test coverage: public engine names some test imports (scripts/symcov.py; ROADMAP 17.82).
symcov = "python3 scripts/symcov.py"
# Which exported leaf kernels need no Mojo runtime import (wasm route; scripts/wasm_probe.py; ROADMAP 17.76).
wasm-probe = { cmd = "python3 scripts/wasm_probe.py", depends-on = ["build"] }
# Regenerate CHANGELOG.md from Conventional Commit subjects (scripts/changelog.py; ROADMAP 17.81).
changelog = "python3 scripts/changelog.py"
# Build twice and compare build/*.mojoc checksums (scripts/repro_probe.py; ROADMAP 17.81).
repro-probe = "python3 scripts/repro_probe.py"
# Instruction count of a fixed workload under cachegrind (scripts/icount.py; ROADMAP 17.83).
icount = "python3 scripts/icount.py"
# Which CPU target / optimisation factors change simulation bits (scripts/fp_probe.py; ROADMAP 17.76).
fp-probe = "python3 scripts/fp_probe.py"
alloc-probe = "python3 scripts/alloc_probe.py"
# Write .vdb files (tests/test_vdb_file.mojo) and read them with OpenVDB's own Python module (ROADMAP 17.63).
vdb-check = { cmd = "mojo run -D ASSERT=all -I build tests/test_vdb_file.mojo && pixi exec --spec openvdb --spec python=3.12 -- python scripts/vdb_check.py build/vdb", depends-on = ["build"] }
# Write .abc files (tests/test_abc_file.mojo) and import them with Blender's Alembic importer (bpy; ROADMAP 17.63).
abc-check = { cmd = "mojo run -D ASSERT=all -I build tests/test_abc_file.mojo && python3 scripts/abc_check.py build/abc", depends-on = ["build"] }
# Build, then run every example.
examples = { cmd = "bash scripts/run_examples.sh", depends-on = ["build"] }
# Build, then run every benchmark and write BENCHMARK_REPORT.md.
benchmark = { cmd = "bash scripts/run_benchmarks.sh", depends-on = ["build"] }
# Build, then run every research experiment (GA feasibility probes).
experiments = { cmd = "bash scripts/run_experiments.sh", depends-on = ["build"] }
# Build, then run every language spike, so toolchain moves cannot rot them unseen.
spikes = { cmd = "bash scripts/run_spikes.sh", depends-on = ["build"] }

# The golden-output identity gate (tools/golden.mojo; tested by its selftest).
golden = "bash scripts/golden.sh"
# One command to gate a change: full suite in the foreground + tested summary +
# golden compare. `pixi run gate -- --selftest` tests the gate's own tools.
gate = "bash scripts/agent_gate.sh"

[dependencies]
# Pinned to the current latest stable release (mojo 1.1.0 / modular 26.6.0,
# both dated 2026-09-10). Exact pins, not a floor: a toolchain bump is a
# deliberate change that reruns the whole test + benchmark gate.
modular = "==26.6.0"
mojo = "==1.1.0"

# valgrind has no osx-arm64 build (ROADMAP 17.76): Linux targets only.
[target.linux-64.dependencies]
valgrind = ">=3.27.1,<4"

[target.linux-aarch64.dependencies]
valgrind = ">=3.27.1,<4"

# macOS ships bash 3.2 (no `declare -A`, used by scripts/run_tests.sh) and no
# `timeout` (scripts/agent_gate.sh): take both from conda-forge there.
[target.osx-arm64.dependencies]
bash = ">=5"
coreutils = "*"
