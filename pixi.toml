[workspace]
name = "ludens-engine"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Same exact pins as ludens-core: the engine imports `max` (parallelize), which the
# standalone compiler package does not carry.
modular = "==26.7.0"
mojo = "==1.2.0"

# wasm64 build and the parity gate: dev-only, see wasm.toml.
[feature.wasm.dependencies]
python = ">=3.11"
clang = "23.1.4.*"
lld = "23.1.4.*"
llvm-tools = "23.1.4.*"
nodejs = "24.*"
# scripts/assets/convert_texture.py resizes with Lanczos; the output bytes are only stable for a fixed Pillow (issue #12).
pillow = "==13.0.0"
# `pixi run -e wasm lint` (scripts/lint.py): only bug-finding ruff rules (ruff.toml), and shellcheck.
ruff = ">=0.17.6,<0.18"
shellcheck = ">=0.11.0,<0.12"

[feature.wasm.pypi-dependencies]
ludens-wasm-rt = { git = "https://github.com/Hundo1018/ludens-wasm-rt", rev = "1034e60e3ee4acf08970c7f48f2fd46eadea344c" }

[feature.wasm.tasks]
parity = "python3 scripts/parity.py"
build-wasm = "bash scripts/build_wasm.sh"
build-web = { cmd = "python3 scripts/build_web.py", depends-on = ["build-wasm"] }
test-web = { cmd = "bash scripts/test_web.sh", depends-on = ["build-web"] }
bench = "python3 scripts/bench.py"
# E31 (#126): step pattern at 60-240 Hz displays and physics cost against a 144 Hz frame (scripts/frame_pacing.py)
frame-pacing = "python3 scripts/frame_pacing.py"
# #123: per-segment frame breakdown (net, step, physics, scene, push, HUD, draw, present) against a 144 Hz frame (scripts/frame_budget.py)
frame-budget = "python3 scripts/frame_budget.py"
# per-tick physics cost against a ludens-core checkout, native + wasm64 (scripts/phys_profile.py --core DIR)
phys-profile = "python3 scripts/phys_profile.py"
multi-wasm-probe = "python3 scripts/multi_wasm_probe.py"
# docs/scene-format.md: how four ways of writing a scene merge under git and what they cost to store; and whether a
# Python behaviour script can run beside the wasm64 module in a browser (Pyodide from npm, built into build/py_probe/).
scene-merge-probe = "python3 scripts/scene_merge_probe.py"
python-web-probe = "python3 scripts/python_web_probe.py"
web-check = "python3 scripts/web_check.py"
serve-web = { cmd = "python3 shell/web/serve.py 8000 build/web", depends-on = ["build-web"] }
# B1 acceptance: app_init + 1 frame under node must not trap.
smoke-node = { cmd = "python3 scripts/smoke_node.py", depends-on = ["build-wasm"] }
# #6 (E1): the directory rules (selftest: `pixi run -e wasm check-layout --selftest`) and the command-layer test.
check-layout = "python3 scripts/check_layout.py"
# Fast static checks: ruff, shellcheck, stale names in comments and docs, Mojo code rules (scripts/lint.py).
lint = "python3 scripts/lint.py"
stale-refs = "python3 scripts/stale_refs.py"
code-rules = "python3 scripts/code_rules.py"
test-editor = "python3 scripts/test_editor.py"
# #11 (E6): the native editor core, the `ludens` command line, and its test.
build-core = "python3 scripts/build_core.py"
# #17 (E12): the ui/ toolkit tests, built with the standard library only.
test-ui = "python3 scripts/test_native.py"
test-game = "python3 scripts/build_core.py --selftest && python3 scripts/test_native.py demo_mode game_save game_controls camera_view input_path game_mode mesh_pass debug_view ao_bake palette_table"
# #119: data tables (game/table.mojo), live tuning (game/tuning.mojo, game/tuning_panel.mojo), the generated accessors and `ludens check` on tables.
gen-table = "python3 scripts/gen_table.py"
test-tables = "python3 scripts/gen_table.py game/data/demo.schema --table game/data/demo.table -o game/demo_table.mojo --check && python3 scripts/test_native.py game_table && python3 tests/test_tables.py"
# #122: one source change at a time to platform/save_store.mojo and game/demo_mode.mojo; the covering test must fail (not in CI: about 2 minutes)
mutation-save = "python3 scripts/mutation_save.py"
test-skinning = "python3 scripts/test_native.py skinning_parity"
test-scene-probe = "python3 scripts/test_native.py scene_probe_native"
# #90: a whole SceneRenderer frame with every pass and option on (tile means against tests/golden/scene_frame_tiles.txt).
test-scene-frame = "python3 scripts/test_native.py scene_frame_native"
# The style pipelines (app/styles_*.mojo): every one renders, differs from the plain frame and from the others.
test-styles = "python3 scripts/test_native.py style_own custom_pipeline_native style_gallery_native"
style-gallery = "python3 scripts/style_gallery.py"
# The lights, the camera's projection / culling / viewports and the lens stages, each against worked values, on lavapipe.
test-lights-camera = "python3 scripts/test_native.py lights_native camera_native lens_native env_probe_native motion_native"
test-texture = "python3 scripts/test_native.py texture_native"
test-texture-c3 = "python3 scripts/test_native.py texture_c3_native"
ui-same = "python3 scripts/ui_same.py"
# #116: the SDF font's glyph table, rasterised text and glyph quads, native against wasm64 (equal bytes)
font-same = "python3 scripts/font_same.py"
xfer-same = "python3 scripts/xfer_same.py"
sheet-same = "python3 scripts/sheet_same.py"
game-same = "python3 scripts/game_same.py"
# #121: particle simulation, packing, budgets, LOD and the `particles` component (CPU only); the emitter table's accessors are current
test-particles = "python3 scripts/gen_table.py game/data/particles.schema --table game/data/particles.table -o game/particles_table.mojo --check && python3 scripts/test_native.py particles"
# #121: the particle pass on lavapipe (depth, alpha order, additive, tile means, frame cost at 1k / 10k / 100k)
test-particles-native = "python3 scripts/test_native.py particles_native"
# #121: particle state and uploaded records, native against wasm64 (equal bytes)
particles-same = "python3 scripts/particles_same.py"
game-shot = "python3 scripts/game_shot.py"
tuning-web = "python3 scripts/tuning_web.py"
# #116: the HUD text at 100 % and 200 %, in English and Traditional Chinese, pseudo-localized, with a safe area (frames in build/shots/text_*.png)
text-shot = "python3 scripts/text_shot.py"
build-pages = "python3 scripts/build_pages.py"
sheet-cost = "python3 scripts/sheet_cost.py"
test-pad = "node --experimental-strip-types --no-warnings scripts/test_pad.mjs"
test-vpad = "node --experimental-strip-types --no-warnings scripts/test_vpad.mjs"
test-assets = "node --no-warnings scripts/test_assets.mjs"
# #12: the asset converters (scripts/assets/) and readers (app/assets.mojo) on synthetic inputs.
test-asset-formats = "python3 scripts/test_asset_formats.py"
# #116: the font importer on Pillow's bundled font, and the committed assets/fonts/*.lfont against the hash and license recorded beside them.
test-font = "python3 scripts/assets/convert_font.py --selftest && python3 scripts/check_font_asset.py"
# #120: the audio mixer (events, buses, ducking, music, positioned voices, LUFS) against worked values; native == wasm64 bytes; the shipped
# music and its license; the mixer inside the real app under node; mixing cost for N voices.
test-audio = "python3 scripts/test_audio.py audio_mixer"
audio-same = "python3 scripts/audio_same.py"
test-audio-assets = "python3 scripts/check_audio_asset.py"
test-audio-app = "python3 scripts/audio_app_check.py"
audio-bench = "python3 scripts/audio_bench.py"
ludens = "python3 scripts/ludens.py"
test-cli = "python3 tests/test_cli.py"
test-os = "python3 scripts/test_os.py"
# net_poll / os_poll: an oversized packet is dropped and counted, the packets behind it still arrive.
test-net = "node tests/test_net.mjs"
# platform/ seams (docs/platform.md), standard library only: one Transport send / poll script over the memory pipe, UDP
# and TCP on loopback; then the local identity, achievements, cloud save and lobby implementations.
test-transport = "python3 scripts/test_native.py platform_transport platform_services platform_save"
test-build = "python3 tests/test_build.py"
# #115 (E21): window.game under node, divergence trace, `ludens sim` batch runner (docs/automation.md); builds build/app.wasm first.
test-automation = { cmd = "python3 tests/test_automation.py", depends-on = ["build-wasm"] }
divergence = "python3 scripts/divergence.py"
# window.game in headless Chrome (?manual&seed=&scene=) against the same job under node.
hook-web = { cmd = "python3 scripts/hook_web_check.py", depends-on = ["build-wasm"] }

[environments]
wasm = { features = ["wasm"] }
