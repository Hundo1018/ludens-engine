<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ludens-engine</title>
<style>
html,body{margin:0;background:#0d0f14;color:#9aa4b2;font:14px system-ui;overscroll-behavior:none}
canvas{display:block;margin:0 auto;max-width:100vw;max-height:100dvh}
p{text-align:center;margin:8px 12px}
.for-touch,html.touch .for-keys{display:none}
html.touch .for-touch{display:block}
</style>
<canvas id="canvas" width="960" height="540"></canvas>
<p class="for-keys">WASD or arrows move, Space jumps, drag with the left button to look, P pauses, R restarts. Click or press a key to start audio.</p>
<p class="for-touch">Left thumb moves, Jump is on the right, drag anywhere else to look. II pauses, R restarts. Sound starts with the first touch.</p>
<pre id="log"></pre>
<script type="module" src="./app.js"></script>
