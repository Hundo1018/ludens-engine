name: editor

on:
  push:
    branches: [main]
  pull_request:

# #6 (E1): the directory rules and the command-layer test. Neither needs a GPU.
jobs:
  layout:
    name: directory rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm
      - name: Selftest, then the repo (the project's own environment)
        run: |
          pixi run -e wasm check-layout --selftest
          pixi run -e wasm check-layout
      - name: Lint (ruff, shellcheck, stale names in comments and docs, Mojo code rules)
        run: pixi run -e wasm lint

  command-layer:
    name: GUI/CLI command parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm
      - name: Command-layer test (GUI entry vs CLI entry give the same world hash)
        run: pixi run -e wasm test-editor

  cli:
    name: ludens command line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm
      - name: ludens new / cmd / script / run across processes
        run: pixi run -e wasm test-cli
      - name: World hand-over between two modules (native == wasm64 == across modules)
        run: |
          bash scripts/deps.sh
          pixi run -e wasm xfer-same
      - name: Event sheet, native == wasm64
        run: pixi run -e wasm sheet-same
      - name: ui/ layout and widgets, native == wasm64
        run: pixi run -e wasm ui-same
      - name: SDF font (#116), native == wasm64
        run: pixi run -e wasm font-same
      - name: Font importer self-test, asset hash and license
        run: pixi run -e wasm test-font
      - name: os_* imports through a wasm64 module, node
        run: pixi run -e wasm test-os
      - name: Input profile, save seam and clipboard share one os_poll reader, node (#117)
        run: pixi run -e wasm test-os-router
      - name: net_poll drops an oversized packet and delivers the next, node
        run: pixi run -e wasm test-net
      - name: ludens build --target web twice, byte-identical manifests
        run: pixi run -e wasm test-build
      - name: Demo game, scripted games natively
        run: pixi run -e wasm test-game
      - name: Demo game, native == wasm64 through the app exports
        run: pixi run -e wasm game-same
      - name: Data tables, live tuning, `ludens check` / `ludens tune` on tables
        run: pixi run -e wasm test-tables
      - name: Automation hook under node, divergence trace, batch runner (#115)
        run: pixi run -e wasm test-automation
      - name: Input actions through the wasm64 app (axes, rebinding, saved profile), node (#117)
        run: pixi run -e wasm test-input
      - name: Gamepad mapping, node
        run: pixi run -e wasm test-pad
      - name: Virtual pad kit, node
        run: pixi run -e wasm test-vpad
      - name: Asset loader and .lsound decoding, node
        run: pixi run -e wasm test-assets
      - name: Asset converters and readers on synthetic inputs (#12)
        run: pixi run -e wasm test-asset-formats

  ui:
    name: ui/ toolkit and platform/ seams (standard library only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm
      - name: Layout and focus tests, built without the engine on the include path
        run: pixi run -e wasm test-ui
      - name: platform/ seams (Transport over memory, UDP and TCP on loopback; local identity, achievements, save, lobby)
        run: pixi run -e wasm test-transport
