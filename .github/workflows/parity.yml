name: parity

on:
  push:
    branches: [main]
  pull_request:

# One job, three comparisons (world hash, PCM hash, pixels), run by scripts/parity_gate.py.
# Pixels render on Mesa lavapipe (software Vulkan) natively and in the runner's Firefox / Chrome.
# Needs deps.lock revs to be reachable on GitHub (the clone fallback in scripts/deps.sh).
jobs:
  parity:
    name: native vs web parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm

      - name: Native wgpu runtime (libwgpu_native, callback bridge)
        run: |
          bash scripts/deps.sh
          pixi run -e wasm bash -c 'CONDA_PREFIX="$CONDA_PREFIX" bash build/deps/wgpu-mojo/scripts/setup-native.sh'

      - name: Skinning parity (B1 CPU and GPU, B2 GPU against CPU) on lavapipe
        run: pixi run -e wasm test-skinning

      - name: Arena centre probe on native wgpu (rigid and skinned, lavapipe)
        run: pixi run -e wasm test-arena-probe

      - name: Texture checks (mip levels and triplanar, exact texels) on lavapipe
        run: pixi run -e wasm test-texture

      - name: Parity gate
        run: |
          export GECKODRIVER="${GECKOWEBDRIVER:+$GECKOWEBDRIVER/geckodriver}"
          export CHROME="$(command -v google-chrome)"
          pixi run -e wasm parity-gate

      - name: Arena game in headless Chrome (software WebGPU), frames checked
        run: pixi run -e wasm game-shot
