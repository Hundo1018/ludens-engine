name: parity

on:
  push:
    branches: [main]
  pull_request:

# One job, three comparisons (world hash, PCM hash, pixels), run by scripts/web_check.py.
# Pixels render on Mesa lavapipe (software Vulkan) natively and in the runner's Firefox / Chrome.
# Needs deps.lock revs to be reachable on GitHub (the clone fallback in scripts/deps.sh).
jobs:
  parity:
    name: native vs web parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: wasm

      - name: Native wgpu runtime (libwgpu_native, callback bridge)
        run: |
          bash scripts/deps.sh
          pixi run -e wasm bash -c 'CONDA_PREFIX="$CONDA_PREFIX" bash build/deps/wgpu-mojo/scripts/setup-native.sh'

      - name: Skinning parity (B1 CPU and GPU, B2 GPU against CPU) on lavapipe
        run: pixi run -e wasm test-skinning

      - name: Centre probe on native wgpu (rigid and skinned, lavapipe)
        run: pixi run -e wasm test-scene-probe
      - name: Whole scene frame, every pass and option on (#90), on lavapipe
        run: pixi run -e wasm test-scene-frame
      - name: Render pipelines (a user-defined one, the 53 style pipelines, their listing) on lavapipe
        run: |
          pixi run -e wasm python3 scripts/test_native.py style_own custom_pipeline_native
          pixi run -e wasm style-gallery --doc --check
      - name: Lights, camera (orthographic, culling, viewports) and lens stages on lavapipe
        run: pixi run -e wasm test-lights-camera

      - name: Particle pass (#121) on lavapipe
        run: pixi run -e wasm test-particles-native
      - name: Frame ring, counters and GPU timestamp timer (#123), on lavapipe
        run: |
          pixi run -e wasm test-frame-stats
          pixi run -e wasm test-frame-counters
      - name: Frame budgets (#123), the scripted scene native and wasm64 against budgets.toml; the gate's own test
        run: |
          pixi run -e wasm perf-gate --runs 3
          pixi run -e wasm test-perf-gate
      - name: Frame trace of the scripted scene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-trace
          path: build/perf_gate/trace.json
          if-no-files-found: ignore

      - name: "Accessibility stages (#118): colour-blind, flash limiter, reduce motion, on lavapipe"
        run: pixi run -e wasm test-access-gpu

      - name: Texture checks (mip levels and triplanar, exact texels) on lavapipe
        run: pixi run -e wasm test-texture

      - name: Triplanar box face (C3) on lavapipe
        run: pixi run -e wasm test-texture-c3

      - name: Web check
        run: |
          export GECKODRIVER="${GECKOWEBDRIVER:+$GECKOWEBDRIVER/geckodriver}"
          export CHROME="$(command -v google-chrome)"
          pixi run -e wasm web-check

      - name: Demo game in headless Chrome (software WebGPU), frames checked
        run: pixi run -e wasm game-shot
      - name: HUD text at 100 and 200 %, en and zh-TW, pseudo-localized, safe area (#116), headless Chrome
        run: pixi run -e wasm text-shot --no-build

      - name: window.game, ?seed / ?scene / ?manual in headless Chrome, hash equal to node (#115)
        run: pixi run -e wasm hook-web

      - name: Live tuning panel in headless Chrome (F2, a slider drag, Export)
        run: pixi run -e wasm tuning-web

      - name: Frame-time overlay (F3) and frame counters in headless Chrome (#123)
        run: pixi run -e wasm perf-overlay-web
